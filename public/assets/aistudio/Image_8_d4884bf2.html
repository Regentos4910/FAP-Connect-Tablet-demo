<!DOCTYPE html><html class="light" lang="en"><head>

              "spacing": {
                      "nav_rail_width": "80px",
                      "margin_tablet": "32px",
                      "touch_target_min": "48px",
                      "unit": "8px",
                      "gutter": "24px",
                      "margin_mobile": "16px"
              },
              "fontFamily": {
                      "title-lg": ["Inter"],
                      "title-md": ["Inter"],

<style>
        /* Landscape Optimization */
        @media (orientation: landscape) {
            .landscape-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 2rem;
            }
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-margin_tablet overflow-hidden relative">
<!-- Decorative Medical Background Element -->
<div class="absolute inset-0 z-0 opacity-10 pointer-events-none" data-alt="A subtle, abstract geometric pattern representing medical data points and connections. Very light, high-key, modern corporate style suitable for a clinical background in a light-mode interface. Focus on clean lines, soft blues and grays." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuC6I2QSqu1L0XV5Sv6n_vK2t62-DP5ORV4fX0vcEvNCG0rxP8FW_5mRayc9ZCCzVeG5G5TDmDxlSo0PUlzKJXm4VtSRZwSV4GSrsythug4iej1tPKohTLUS20GhMp-VfL6AadWLh0z_pkccH1NBDm3sxGzrKVAc9n55nenns2Rvv9ovuXGkN9WxO3M4Oe2XXfiavdrdbjPdY6ZrddWZKiQM01iL_Ytjzz_lHSEt6iR7BMbOXkoODwq-')"></div>
<!-- Login Card -->
<main class="relative z-10 w-full max-w-5xl bg-surface-container-lowest rounded-xl shadow-lg border border-outline-variant flex flex-col md:flex-row overflow-hidden">
<!-- Branding & Context (Left/Top) -->
<section class="bg-surface-container-low p-gutter flex flex-col justify-between md:w-5/12 border-b md:border-b-0 md:border-r border-outline-variant">
<div class="space-y-6">
<!-- Logos -->
<div class="flex items-center gap-4">
<img class="w-16 h-16 object-contain" data-alt="High quality vector logo for Bharati Vidyapeeth Medical College. Professional, clean, clinical blue and white color scheme. Modern academic and medical crest style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDvqOK4vQ9ou6Zou9tZIGwSNMZOkLVI19jslhAc_MP1hyreyL-aOVMNfchDFdpTuSIO4x67tjtJVxB2pF6IYqLKM6AYBAIaoKLvTG7e0FUKpAy7E2oTyosDUMv6woPW7Oe0jTeIwWiuNYnmkE3mFoHsscFr_ihyxnf1P7OUbSP5LPxtVvEPiUf7fhZ1R6NpKPTHuDlkmejp98ZfdQdgJtUUGudX2NI3Ot6q9Mwmt6Ga0UDdXoVSclNQ">
<div>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">FAP Connect</h1>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1 uppercase tracking-wider">Clinical Data Portal</p>
</div>
</div>
<div class="mt-8 hidden md:block">
<p class="font-body-md text-body-md text-on-surface-variant max-w-sm">Secure access for medical students and staff to manage family health profiles and clinical assignments.</p>
</div>
</div>
<!-- Sync Status & Offline Indicator -->
<div class="mt-8 pt-6 border-t border-outline-variant/50 space-y-4">
<div class="flex items-center gap-3">
<div class="w-3 h-3 rounded-full bg-tertiary-container animate-pulse shadow-[0_0_8px_rgba(172,98,0,0.5)]"></div>
<span class="font-label-lg text-label-lg text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">cloud_off</span>
                        Offline Mode Ready
                    </span>
</div>
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-[18px] text-primary">sync</span>
<span class="font-label-sm text-label-sm text-outline">Last sync: 2 hours ago</span>
</div>
</div>
</section>
<!-- Form Section (Right/Bottom) -->
<section class="p-gutter md:p-12 md:w-7/12 flex flex-col justify-center">
<div class="mb-8">
<h2 class="font-title-lg text-title-lg text-on-surface mb-2">Sign In</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Enter your credentials to access your assignments.</p>
</div>
<form class="space-y-6" onsubmit="event.preventDefault();">
<!-- Username -->
<div class="space-y-2">
<label class="font-label-lg text-label-lg text-on-surface block" for="username">Username</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">person</span>
<input class="w-full min-h-[48px] pl-12 pr-4 bg-surface rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow font-body-md text-body-md text-on-surface" id="username" name="username" placeholder="Enter your ID" type="text">
</div>
</div>
<!-- Password -->
<div class="space-y-2">
<label class="font-label-lg text-label-lg text-on-surface block" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full min-h-[48px] pl-12 pr-4 bg-surface rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow font-body-md text-body-md text-on-surface" id="password" name="password" placeholder="Enter password" type="password">
</div>
</div>
<!-- Actions -->
<div class="pt-4 flex flex-col gap-4">
<button class="w-full min-h-[48px] bg-primary text-on-primary font-label-lg text-label-lg rounded-lg flex items-center justify-center gap-2 hover:bg-primary-container hover:text-on-primary-container active:scale-[0.98] transition-all shadow-sm" type="submit">
<span>Login</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<button class="w-full min-h-[48px] bg-transparent text-primary font-label-lg text-label-lg rounded-lg flex items-center justify-center hover:bg-surface-container-low transition-colors" type="button">
                        Forgot Password?
                    </button>
</div>
</form>
</section>
</main>
</body></html>
